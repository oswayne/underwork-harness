# Replay counterpart to cordis.yml. It includes the base `cordis.yml` directly
# because a config patch cannot target an entry behind a nested include, then
# disables the key-requiring DeepSeek adapter and inserts `llm-replay` to serve
# the recorded script without a key or network. Persistence stays raw JSONL so
# the recorded session fixture is plain text.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
