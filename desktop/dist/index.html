<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Underwork Harness</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            ellipse 45% 24% at 50% 56%,
            rgba(97, 120, 216, 0.09) 0%,
            rgba(97, 120, 216, 0.04) 45%,
            transparent 72%
          ),
          #f9fafb;
        color: #0f1115;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      .card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .logo { height: 40px; width: auto; }
      .wordmark { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0.08em; }
      .shimmer {
        display: inline-flex;
        align-items: center;
        height: 26px;
        font-size: 14px;
        line-height: 22px;
        font-weight: 500;
        white-space: nowrap;
        background: linear-gradient(
          90deg,
          #4176e6 0%,
          #4176e6 40%,
          #d3e2ff 50%,
          #4176e6 60%,
          #4176e6 100%
        );
        background-position: 100% 0;
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: shimmer 1.8s linear infinite;
      }
      @keyframes shimmer { to { background-position: 0 0; } }
      @media (prefers-reduced-motion: reduce) {
        .shimmer { background-position: 0 0; background-size: 100% 100%; animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(
              ellipse 45% 24% at 50% 56%,
              rgba(97, 120, 216, 0.09) 0%,
              rgba(97, 120, 216, 0.04) 45%,
              transparent 72%
            ),
            #151517;
          color: #f9fafb;
        }
        .logo { filter: invert(1); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img class="logo" src="uicp-logo.png" alt="" />
        <span class="wordmark">Underwork Harness</span>
      </div>
      <div class="shimmer">正在启动…</div>
    </div>
  </body>
</html>
