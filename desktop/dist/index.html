<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Underwork Harness</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #f9fafb;
        color: #0f1115;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      .card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .wordmark { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0.08em; }
      .spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid rgb(0 0 0 / 10%);
        border-top-color: #0f1115;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #151517; color: #f9fafb; }
        .spinner { border-color: rgb(255 255 255 / 12%); border-top-color: #f9fafb; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="wordmark">Underwork Harness</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
